<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — FloodGuard KL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand svg { width: 48px; height: 48px; margin-bottom: 10px; }
        .brand h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }
        .btn-login:hover { opacity: 0.9; }
        #error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="login-card">
        <div class="brand">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="15" stroke="url(#brandGrad)" stroke-width="2"/>
                <path d="M8 20 Q12 14 16 18 Q20 22 24 16" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                <defs>
                    <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32">
                        <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1>Admin Access</h1>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login">Login</button>
            <div id="error-msg">Invalid credentials</div>
        </form>
        <a href="index.html" class="back-link">Return to Public Portal</a>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('.btn-login');
            btn.textContent = 'Authenticating...';
            
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            try {
                const res = await fetch('http://localhost:8000/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('admin_token', data.token);
                    if (data.role === 'responder') {
                        window.location.href = 'responder.html';
                    } else {
                        window.location.href = 'admin.html';
                    }
                    return;
                } else if (res.status === 404) {
                    // Port 8000 is occupied by another app or endpoint missing -> fallback
                    throw new Error('Endpoint not found');
                } else {
                    document.getElementById('error-msg').textContent = 'Invalid credentials';
                    document.getElementById('error-msg').style.display = 'block';
                    btn.textContent = 'Login';
                }
            } catch(e) {
                // FALLBACK ZERO-BACKEND UNTUK GITHUB PAGES & OFFLINE
                if (payload.username === 'admin' && payload.password === 'admin123') {
                    console.warn("Backend API offline or unreachable. Using Mock Login for Admin.");
                    sessionStorage.setItem('admin_token', 'mock-admin-token');
                    window.location.href = 'admin.html';
                } else if (payload.username === 'bomba' && payload.password === 'bomba123') {
                    console.warn("Backend API offline or unreachable. Using Mock Login for Responder.");
                    sessionStorage.setItem('admin_token', 'mock-responder-token');
                    window.location.href = 'responder.html';
                } else {
                    document.getElementById('error-msg').textContent = 'Invalid credentials';
                    document.getElementById('error-msg').style.display = 'block';
                    btn.textContent = 'Login';
                }
            }
        });
    </script>
</body>
</html>
