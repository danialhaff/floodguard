<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Responder Dashboard | FloodGuard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responder.css">
</head>
<body>
    <header class="responder-header">
        <div class="brand">
            <div class="siren">🚨</div>
            <div>
                <h1>NADMA / Bomba Command Center</h1>
                <span class="subtitle">Live Rescue Dispatch System</span>
            </div>
        </div>
        <div class="header-actions">
            <div class="status-online"><span class="pulse"></span> Active Monitoring</div>
            <a href="login.html" class="btn-exit">Exit</a>
        </div>
    </header>

    <main class="responder-layout">
        <!-- Left: Live Map -->
        <section class="map-section">
            <div id="responder-map"></div>
        </section>

        <!-- Right: Control Panel -->
        <section class="control-section">
            <div class="stats-row">
                <div class="stat-box warning">
                    <div class="stat-num" id="sos-pending-count">0</div>
                    <div class="stat-label">Pending SOS</div>
                </div>
                <div class="stat-box success">
                    <div class="stat-num" id="sos-resolved-count">0</div>
                    <div class="stat-label">Dispatched</div>
                </div>
            </div>

            <h2 class="panel-title">Emergency Requests (SOS)</h2>
            <div class="sos-list" id="sos-list">
                <!-- SOS items injected by JS -->
                <div class="loading-state">Loading live requests...</div>
            </div>

            <h2 class="panel-title" style="margin-top: 24px;">Evacuation Centers (PPS) Status</h2>
            <div class="pps-list" id="pps-list">
                 <!-- PPS items injected by JS -->
                 <div class="loading-state">Loading PPS status...</div>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/responder.js"></script>
</body>
</html>
